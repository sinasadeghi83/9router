name: Publish @sinatechs/9router

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build, test, pack without publishing)"
        required: false
        default: false
        type: boolean
      dist_tag:
        description: "npm dist-tag (e.g. latest, beta, next)"
        required: false
        default: "latest"
        type: string
      create_release:
        description: "Create GitHub Release & Tag (on manual trigger)"
        required: false
        default: true
        type: boolean

concurrency:
  group: publish-cli-master-sina
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build & Publish @sinatechs/9router
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify commit belongs to master-sina
        run: |
          echo "Verifying branch restrictions for master-sina..."
          git fetch origin master-sina:refs/remotes/origin/master-sina

          # 1. On workflow_dispatch, enforce execution from branch master-sina
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.ref_name }}" != "master-sina" ]; then
              echo "::error::Manual workflow dispatch is strictly restricted to branch 'master-sina' (triggered on: ${{ github.ref_name }})."
              exit 1
            fi
          fi

          # 2. Verify that the commit being published is an ancestor of origin/master-sina
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/master-sina; then
            echo "::error::Publishing is strictly restricted to commits on branch 'master-sina'. Commit ${{ github.sha }} is not an ancestor of origin/master-sina."
            exit 1
          fi

          echo "✅ Commit ${{ github.sha }} successfully verified on branch master-sina."

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate tag and package version
        id: version
        run: |
          node <<'NODE'
          const fs = require('fs');

          const pkg = JSON.parse(fs.readFileSync('./cli/package.json', 'utf8'));
          const version = pkg.version;
          if (!version) {
            console.error('::error::No version found in cli/package.json');
            process.exit(1);
          }
          console.log(`CLI Package Version: ${version}`);

          const ref = process.env.GITHUB_REF || '';
          if (ref.startsWith('refs/tags/v')) {
            const tagVersion = ref.replace('refs/tags/v', '');
            if (tagVersion !== version) {
              console.error(`::error::Version mismatch: Git tag is "v${tagVersion}", but cli/package.json is "${version}".`);
              process.exit(1);
            }
            console.log(`✅ Git tag v${tagVersion} matches cli/package.json version.`);
          }

          const isPrerelease = /-(alpha|beta|rc|canary)/i.test(version);
          const outputFile = process.env.GITHUB_OUTPUT;
          if (outputFile) {
            fs.appendFileSync(outputFile, `version=${version}\n`);
            fs.appendFileSync(outputFile, `tag_name=v${version}\n`);
            fs.appendFileSync(outputFile, `is_prerelease=${isPrerelease}\n`);
          }
          NODE

      - name: Build CLI package
        run: pnpm --dir cli run build

      - name: Smoke test CLI binary
        run: |
          node cli/cli.js --help
          CLI_OUTPUT_VERSION=$(node cli/cli.js --version)
          echo "CLI Output Version: $CLI_OUTPUT_VERSION"
          if [ "$CLI_OUTPUT_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::CLI binary reported version $CLI_OUTPUT_VERSION, expected ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Pack CLI package into tarball
        id: pack
        run: |
          TARBALL_PATH=$(pnpm --dir cli pack --pack-destination .. | tail -n 1)
          if [ ! -f "$TARBALL_PATH" ]; then
            TARBALL_PATH="./sinatechs-9router-${{ steps.version.outputs.version }}.tgz"
          fi
          if [ ! -f "$TARBALL_PATH" ]; then
            echo "::error::Tarball file not found at $TARBALL_PATH"
            exit 1
          fi
          echo "Packed tarball: $TARBALL_PATH"
          ls -lh "$TARBALL_PATH"
          echo "tarball_path=$TARBALL_PATH" >> $GITHUB_OUTPUT

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: sinatechs-9router-${{ steps.version.outputs.version }}
          path: ${{ steps.pack.outputs.tarball_path }}
          if-no-files-found: error

      - name: Publish to official npm registry
        if: ${{ inputs.dry_run != true }}
        run: |
          pnpm --dir cli publish \
            --access public \
            --no-git-checks \
            --ignore-scripts \
            --tag "${{ inputs.dist_tag || 'latest' }}" \
            --provenance

      - name: Create GitHub Release
        if: ${{ inputs.dry_run != true && (startsWith(github.ref, 'refs/tags/v') || inputs.create_release != false) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: "Release ${{ steps.version.outputs.tag_name }}"
          files: ${{ steps.pack.outputs.tarball_path }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.version.outputs.is_prerelease == 'true' && 'false' || 'true' }}
